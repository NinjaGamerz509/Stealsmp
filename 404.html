<!DOCTYPE html>

  <style>
    .notfound-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .notfound-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,107,0,0.06), transparent 60%);
    }
    .notfound-num {
      font-family: var(--font-display);
      font-size: clamp(100px, 20vw, 200px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.15;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
      user-select: none;
    }
    .notfound-content { position: relative; z-index: 1; }
    .notfound-icon { font-size: 56px; color: rgba(255,107,0,0.3); margin-bottom: 20px; }
    .notfound-title {
      font-family: var(--font-display);
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 900;
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .notfound-desc {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 360px;
    }
    .notfound-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
